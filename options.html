<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Reminder settings</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body { max-width: 720px; margin: 0 auto; padding: 24px 16px; display: flex; flex-direction: column; gap: 14px; }
    h1 { margin: 0; font-size: 22px; }
    h2 { margin: 0; font-size: 17px; }
    .card { display: flex; flex-direction: column; gap: 10px; }
    .rule { flex-wrap: wrap; }
    .rule input[type="number"] { width: 80px; }
    label.field { display: flex; flex-direction: column; gap: 4px; }
    label.field input { width: 100%; }
    .remove { padding: 3px 8px; }
    #saved { color: var(--github); }
  </style>
</head>
<body>
  <h1>Reminder settings</h1>

  <div class="card">
    <label class="row"><input type="checkbox" id="enabled"> All reminders on</label>
    <label class="row"><input type="checkbox" id="popupWindow"> Open a popup window (not just a notification)</label>
    <label class="row"><input type="checkbox" id="sound"> Play a sound</label>
    <label class="row">Snooze for <input type="number" id="snoozeMinutes" min="1" max="120"> minutes</label>
  </div>

  <div id="reminders" style="display:flex;flex-direction:column;gap:14px"></div>

  <div class="row">
    <button class="primary" id="save">Save</button>
    <button id="reset">Reset to defaults</button>
    <span id="saved"></span>
  </div>
  <script type="module" src="options.js"></script>
</body>
</html>
